apiVersion: postgres-operator.crunchydata.com/v1
kind: PostgresCluster
metadata:
  name: hippo
  namespace: crunchy
spec:
  postgresVersion: 18
  instances:
    - name: instance1
      replicas: 3
      dataVolumeClaimSpec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  postgres-operator.crunchydata.com/cluster: hippo
                  postgres-operator.crunchydata.com/instance-set: instance1
  backups:
    pgbackrest:
      configuration:
      - secret:
          name: hippo-pgbackrest-secrets
      global:
        repo2-path: /pgbackrest/crunchy/hippo/repo2
        repo2-s3-uri-style: path
        repo2-storage-port: "9000"
      repos:
      - name: repo1
        volume:
          volumeClaimSpec:
            accessModes: [ReadWriteOnce]
            resources: {requests: {storage: 1Gi}}
      - name: repo2
        schedules:
          full: "0 1 * * 0"
        s3:
          bucket: percona
          endpoint: minio.minio.svc
          region: us-east-1
  proxy:
    pgBouncer:
      replicas: 2
