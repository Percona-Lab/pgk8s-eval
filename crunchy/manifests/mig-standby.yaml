apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: mig-standby
spec:
  crVersion: 3.1.0
  image: docker.io/percona/percona-distribution-postgresql:18.6.1-3
  postgresVersion: 18
  users:
  - name: hippo
    databases: [hippo]
  standby:
    enabled: true
    host: hippo-ha.crunchy.svc.cluster.local
    port: 5432
    repoName: repo1
  secrets:
    customTLSSecret: {name: hippo-cluster-cert}
    customReplicationTLSSecret: {name: hippo-replication-cert}
  extensions:
    pg_stat_statements: {enabled: true}
    set_user: {enabled: true}
    pg_cron: {enabled: true}
  instances:
  - name: instance1
    replicas: 2
    dataVolumeClaimSpec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 2Gi}}}
  proxy: {pgBouncer: {replicas: 1, image: docker.io/percona/percona-pgbouncer:1.25.2-8}}
  backups:
    pgbackrest:
      image: docker.io/percona/percona-pgbackrest:2.59.1-2
      configuration:
      - secret: {name: mig-pgbackrest-secret}
      global:
        repo1-path: /pgbackrest/crunchy/hippo/repo2
        repo1-s3-uri-style: path
        repo1-storage-port: "9000"
        repo1-storage-verify-tls: "n"
      repos:
      - name: repo1
        s3: {bucket: percona, endpoint: minio.minio.svc, region: us-east-1}
