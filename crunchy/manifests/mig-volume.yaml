apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: mig-volume
spec:
  crVersion: 3.1.0
  image: docker.io/percona/percona-distribution-postgresql:18.6.1-3
  postgresVersion: 18
  autoCreateUserSchema: false
  users:
  - name: hippo
    databases: [hippo]
  extensions:
    pg_stat_statements: {enabled: true}
    set_user: {enabled: true}
    pg_cron: {enabled: true}
  instances:
  - name: instance1
    replicas: 1
    dataVolumeClaimSpec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 1Gi}}
      selector:
        matchLabels: {percona-pv-migration: migrated}
  proxy: {pgBouncer: {replicas: 1, image: docker.io/percona/percona-pgbouncer:1.25.2-8}}
  backups:
    pgbackrest:
      image: docker.io/percona/percona-pgbackrest:2.59.1-2
      repos:
      - name: repo1
        volume:
          volumeClaimSpec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 2Gi}}}
