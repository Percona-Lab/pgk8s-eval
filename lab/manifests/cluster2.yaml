apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: cluster2
spec:
  crVersion: 3.1.0
  image: docker.io/percona/percona-distribution-postgresql:18.6.1-1
  postgresVersion: 18
  dataSource:
    pgbackrest:
      stanza: db
      configuration:
      - secret:
          name: cluster2-restore-secret
      global:
        repo1-path: /pgbackrest/postgres-operator/cluster1/repo2
        repo1-s3-uri-style: path
        repo1-storage-port: "9000"
      options:
      - --type=time
      - --target="2026-10-13 22:20:09+00"
      repo:
        name: repo1
        s3:
          bucket: percona
          endpoint: minio.minio.svc
          region: us-east-1
  instances:
  - name: instance1
    replicas: 1
    dataVolumeClaimSpec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 1Gi}}
  proxy:
    pgBouncer:
      replicas: 1
      image: docker.io/percona/percona-pgbouncer:1.25.2-6
  backups:
    pgbackrest:
      image: docker.io/percona/percona-pgbackrest:2.59.0-1
      repos:
      - name: repo1
        volume:
          volumeClaimSpec:
            accessModes: [ReadWriteOnce]
            resources: {requests: {storage: 1Gi}}
