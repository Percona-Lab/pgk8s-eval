apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata: {name: ts-img, namespace: postgres-operator}
spec:
  crVersion: 3.1.0
  image: docker.io/percona/percona-distribution-postgresql:18.99.1-1
  postgresVersion: 18
  instances: [{name: instance1, replicas: 1, dataVolumeClaimSpec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}}]
  proxy: {pgBouncer: {replicas: 1, image: docker.io/percona/percona-pgbouncer:1.25.2-6}}
  backups: {pgbackrest: {image: docker.io/percona/percona-pgbackrest:2.59.0-1, repos: [{name: repo1, volume: {volumeClaimSpec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}}}]}}
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata: {name: ts-sc, namespace: postgres-operator}
spec:
  crVersion: 3.1.0
  image: docker.io/percona/percona-distribution-postgresql:18.6.1-1
  postgresVersion: 18
  instances: [{name: instance1, replicas: 1, dataVolumeClaimSpec: {storageClassName: fast-ssd, accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}}]
  proxy: {pgBouncer: {replicas: 1, image: docker.io/percona/percona-pgbouncer:1.25.2-6}}
  backups: {pgbackrest: {image: docker.io/percona/percona-pgbackrest:2.59.0-1, repos: [{name: repo1, volume: {volumeClaimSpec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}}}]}}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: {name: ts-img}
spec: {instances: 1, imageName: "ghcr.io/cloudnative-pg/postgresql:18.99-system-trixie", storage: {size: 1Gi}}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: {name: ts-sc}
spec: {instances: 1, storage: {size: 1Gi, storageClass: fast-ssd}}
