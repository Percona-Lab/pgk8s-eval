apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata: {name: store-a, namespace: site-a}
spec:
  configuration:
    destinationPath: s3://cnpg/RUN/
    endpointURL: https://<s3-site-ip>:30900
    endpointCA: {name: s3x-ca, key: ca.crt}
    s3Credentials:
      accessKeyId: {name: s3-creds, key: ACCESS_KEY_ID}
      secretAccessKey: {name: s3-creds, key: ACCESS_SECRET_KEY}
    wal: {compression: gzip}
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata: {name: store-b, namespace: site-a}
spec:
  configuration:
    destinationPath: s3://cnpg/RUN/
    endpointURL: https://<s3-site-ip>:30900
    endpointCA: {name: s3x-ca, key: ca.crt}
    s3Credentials:
      accessKeyId: {name: s3-creds, key: ACCESS_KEY_ID}
      secretAccessKey: {name: s3-creds, key: ACCESS_SECRET_KEY}
    wal: {compression: gzip}
---
apiVersion: v1
kind: Service
metadata: {name: dr-a-np, namespace: site-a}
spec: {type: NodePort, selector: {cnpg.io/cluster: dr-a, cnpg.io/instanceRole: primary}, ports: [{port: 5432, nodePort: 31001}]}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: {name: dr-a, namespace: site-a}
spec:
  instances: 2
  storage: {size: 2Gi}
  enableSuperuserAccess: true
  superuserSecret: {name: dr-super}
  bootstrap: {initdb: {database: app, owner: app}}
  plugins:
  - {name: barman-cloud.cloudnative-pg.io, isWALArchiver: true, parameters: {barmanObjectName: store-a}}
  replica: {self: dr-a, primary: dr-a, source: dr-b}
  externalClusters:
  - {name: dr-a, plugin: {name: barman-cloud.cloudnative-pg.io, parameters: {barmanObjectName: store-a, serverName: dr-a}}}
  - name: dr-b
    plugin: {name: barman-cloud.cloudnative-pg.io, parameters: {barmanObjectName: store-b, serverName: dr-b}}
