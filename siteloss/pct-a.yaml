apiVersion: v1
kind: Service
metadata: {name: dra-np, namespace: pct-a}
spec: {type: NodePort, selector: {postgres-operator.crunchydata.com/cluster: dra, postgres-operator.crunchydata.com/role: primary}, ports: [{port: 5432, nodePort: 31011}]}
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata: {name: dra, namespace: pct-a}
spec:
  crVersion: 3.1.0
  image: docker.io/percona/percona-distribution-postgresql:18.6.1-3
  postgresVersion: 18
  users: [{name: app, databases: [app]}]
#STANDBY
  instances:
  - name: instance1
    replicas: 2
    dataVolumeClaimSpec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 2Gi}}}
  proxy: {pgBouncer: {replicas: 1, image: docker.io/percona/percona-pgbouncer:1.25.2-8}}
  backups:
    pgbackrest:
      image: docker.io/percona/percona-pgbackrest:2.59.1-2
      configuration: [{secret: {name: dr-pgbackrest}}]
      global: {repo1-path: /pgbackrest/RUN/repo1, repo1-s3-uri-style: path, repo1-storage-port: "30900", repo1-storage-verify-tls: "n"}
      repos: [{name: repo1, s3: {bucket: percona, endpoint: <s3-site-ip>, region: us-east-1}}]
